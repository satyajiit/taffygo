[package]
name = "adblock"
version = "0.13.3"
authors = ["Anton Lazarev <alazarev@brave.com>", "Andrius Aucinas"]
edition = "2024"
description = "Native Rust module for Adblock Plus syntax (e.g. EasyList, EasyPrivacy) filter parsing and matching."
repository = "https://github.com/brave/adblock-rust/"
license = "MPL-2.0"
publish = false

exclude = [
    "*.md",
    ".github/",
    ".gitignore",
    ".npmignore",
    "data/",
    "examples/",
    "js/",
    "package-lock.json",
    "package.json",
    "tests/",
]

[dependencies]
addr = { version = "0.15", default-features = false, features = ["psl"], optional = true }
percent-encoding = "2.1"
regex = "1.12.3"
bitflags = { version = "2.10.0", features = ["serde"] }
itertools = "0.14"
idna = "1.0.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
seahash = "4.1.0"
rustc-hash = { version = "2.1", default-features = false }
memchr = "2.8"
base64 = "0.22"
arrayvec = "0.7"
thiserror = "1.0"
flatbuffers = { version = "25.12.19" }

# Own workspace so cargo does not treat this path crate as a member of the
# TaffyGo product workspace (decision 0086).
[workspace]

[lib]
bench = false

[features]
# TaffyGo disables `single-thread` so Engine is Send+Sync (shared across
# throttle sequences). css-validation is off so cssparser/selectors stay out.
default = ["embedded-domain-resolver", "full-regex-handling"]
full-regex-handling = []
single-thread = []
debug-info = []
css-validation = []
content-blocking = []
embedded-domain-resolver = ["addr"]
resource-assembler = []
