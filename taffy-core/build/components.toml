# The artifacts decision 0202 carries in the package, and the GN target that
# puts them there. Bytes and a build file, no code: the browser's seeder is in
# browser.host and the rules that hold these bytes to the catalogue are the
# asset plane's own generator. It is a component of its own rather than part
# of `delivery.asset-plane` because the dependency runs the other way from
# that crate's — the Android assembly has to depend on it to package it, and
# an `app.android` edge to the core's Rust crate would be a layer inversion.
# `third-party.easylist` is the same shape for the same reason.
[[component]]
id = "delivery.bundled"
state = "active"
process = "neutral"
trust = "core"
layer = 10
platforms = ["android"]
sources = [
  "components/delivery/BUILD.gn",
  "components/delivery/bundled/**",
  "components/delivery/bundled_assets.gni",
]
direct_deps = []
gn_targets = ["//taffy/components/delivery:bundled_delivery_assets"]
gradle_path = ""
gradle_api_surface = "none"
gradle_api_deps = []
test_only = false

# The performing half of the filtering plane (decision 0076): the network
# hook, the loaded rule sets, the per-tab counters and the preference
# writes. It lives in the browser process because a subresource request
# never reaches the sandboxed core.
[[component]]
id = "filtering.browser"
state = "active"
process = "browser"
trust = "browser"
layer = 30
platforms = ["android", "macos", "windows"]
sources = ["components/filtering/browser/**"]
direct_deps = ["filtering.core", "filtering.mojom"]
gn_targets = [
  "//taffy/components/filtering/browser:browser",
  "//taffy/components/filtering/browser:prefs",
]
gradle_path = ""
gradle_api_surface = "none"
gradle_api_deps = []
test_only = false

# The ad- and tracker-blocking decision policy (decision 0076): a pure
# matcher that answers block or allow given compiled rules, a per-site
# posture and one request's facts. The engine inside is Brave's
# adblock-rust through a C ABI (decision 0086).
[[component]]
id = "filtering.core"
state = "active"
process = "neutral"
trust = "core"
layer = 20
platforms = ["android", "macos", "windows"]
sources = ["components/filtering/core/**"]
direct_deps = ["third-party.adblock-rust"]
gn_targets = ["//taffy/components/filtering/core:core"]
gradle_path = ""
gradle_api_surface = "none"
gradle_api_deps = []
test_only = false

# The renderer-to-browser filtering seams (decision 0086). The renderer holds
# the remotes and the browser implements both cosmetic lookup and resource
# decisions. They never enter BIP, the Core API, or the journal.
[[component]]
id = "filtering.mojom"
state = "active"
process = "neutral"
trust = "core"
layer = 10
platforms = ["android", "macos", "windows"]
sources = ["components/filtering/mojom/**"]
direct_deps = []
gn_targets = ["//taffy/components/filtering/mojom:mojom"]
gradle_path = ""
gradle_api_surface = "none"
gradle_api_deps = []
test_only = false

# Renderer half of Ads and trackers: apply browser-decided cosmetics and defer
# renderer-originated resources while the browser decides. The engine, posture,
# and blocked counters stay in the browser process.
[[component]]
id = "filtering.renderer"
state = "active"
process = "renderer"
trust = "sandboxed"
layer = 20
platforms = ["android", "macos", "windows"]
sources = ["components/filtering/renderer/**"]
direct_deps = ["filtering.mojom"]
gn_targets = ["//taffy/components/filtering/renderer:renderer"]
gradle_path = ""
gradle_api_surface = "none"
gradle_api_deps = []
test_only = false

