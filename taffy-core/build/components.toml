# TaffyGo component graph. `component_graph.py` owns this schema and checks it.
#
# `layer` is the tier a component declares for itself, and every first-party
# edge must fall strictly: a component may depend only on a lower layer. The
# process and trust matrices already say which *kind* of component may reach
# which; this says which way the graph points, so an inversion that is not a
# cycle — a leaf reaching up into a surface — is a finding rather than a build
# that happens to link. The bands are spaced by ten so a tier can be inserted
# without renumbering the graph:
#
#   10  leaves — generated contracts, resources, vendored third party, and the
#       pure data and model modules. Nothing first-party sits beneath them.
#   20  the first layer built on a leaf: the portable engines, the renderer
#       seam, the sandboxed service shells, and the planned surfaces.
#   30  subsystem facades, each composing two or more layer-20 pieces.
#   40  the browser host, the core service, and the Compose modules that own
#       one domain surface.
#   45  the utility-process service registry. It sat at 50 beside the test
#       assemblies until one of them needed it: a harness that launches a real
#       sandboxed worker must install the product's own registry rather than a
#       second one, and an assembly reaching a peer is the inversion the layer
#       rule exists to catch. It composes only sandboxed services, so it sits
#       under every assembly, product and test alike.
#   50  feature surfaces and the test assemblies.
#   60  the Android UI assembly.
#   70  the product assembly.
#   80  Android Profile tests that compose the shipping assembly.
schema_version = 3
root_label = "//taffy"

[[component]]
id = "app.android"
state = "active"
process = "assembly"
trust = "assembly"
layer = 70
platforms = ["android"]
sources = ["app/android/**"]
direct_deps = ["browser.host", "common", "contracts.aggregate", "contracts.core-api", "contracts.core-service", "delivery.bundled", "renderer", "resources", "third-party.easylist", "ui.android.app", "ui.android.core.api", "ui.android.core.browser", "ui.android.core.common", "ui.android.core.designsystem", "ui.android.core.model", "ui.android.core.page-intelligence", "ui.android.core.preferences", "ui.android.core.providerauth", "ui.android.core.ui", "ui.android.feature.browsing", "ui.android.feature.downloads", "ui.android.feature.settings", "utility.registry"]
gn_targets = ["//taffy/app/android:taffy_public_apk", "//taffy/app/android:taffy_public_base_bundle_module", "//taffy/app/android:taffy_public_bundle", "//taffy:native", "//taffy:product"]
gradle_path = ""
gradle_api_surface = "none"
gradle_api_deps = []
test_only = false

